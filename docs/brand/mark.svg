<!-- GaleQEA mark. Monochrome by design: in a test tool colour carries meaning
     (pass / fail / flaky), so the brand must never compete with it.
     `currentColor` so it inherits wherever it is placed. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="currentColor">
  <rect x="3" y="4" width="26" height="4.6"/>
  <rect x="13.7" y="8.6" width="4.6" height="7.4"/>
  <rect x="13.7" y="19.4" width="4.6" height="8.6"/>
</svg>
