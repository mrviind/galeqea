<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="GaleQEA: AI-first test automation, on your model or none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#5c93c9" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#5c93c9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#0b0c0e"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- wordmark lockup -->
  <g transform="translate(80,96)">
    <rect width="72" height="72" rx="18" fill="#0A192F"/>
    <g transform="translate(16,16)" fill="none" stroke="#FFD60A" stroke-width="4.4" stroke-linecap="round">
      <path d="M4 13h22a5 5 0 1 0-5-5"/>
      <path d="M4 20h28a5 5 0 1 1-5 5"/>
      <path d="M4 27h16a4.4 4.4 0 1 1-4.4 4.4"/>
    </g>
    <text x="92" y="52" font-family="Inter, system-ui, sans-serif" font-size="46">
      <tspan fill="#a0a4ad" font-style="italic" font-weight="400">gale</tspan><tspan fill="#FFD60A" font-weight="800">QE</tspan><tspan fill="#a0a4ad" font-style="italic" font-weight="400">a</tspan>
    </text>
  </g>

  <text x="80" y="300" font-family="Inter, system-ui, sans-serif" font-size="66" font-weight="800" fill="#e8e9ec" letter-spacing="-1.5">Point it at any URL.</text>
  <text x="80" y="376" font-family="Inter, system-ui, sans-serif" font-size="66" font-weight="800" fill="#94bce0" letter-spacing="-1.5">It explores, plans, tests.</text>

  <text x="80" y="452" font-family="Inter, system-ui, sans-serif" font-size="30" fill="#a0a4ad">AI-first test automation in a real browser, on your model, or none.</text>

  <!-- footer chips -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="22" fill="#a0a4ad">
    <rect x="80"  y="520" width="230" height="52" rx="26" fill="#17181b" stroke="#26282d"/>
    <text x="104" y="553">Open source</text>
    <rect x="330" y="520" width="250" height="52" rx="26" fill="#17181b" stroke="#26282d"/>
    <text x="354" y="553">Self-hostable</text>
    <rect x="600" y="520" width="240" height="52" rx="26" fill="#17181b" stroke="#26282d"/>
    <text x="624" y="553">Runs on any LLM</text>
    <rect x="860" y="520" width="220" height="52" rx="26" fill="#17181b" stroke="#26282d"/>
    <text x="884" y="553">Pay to build</text>
  </g>
