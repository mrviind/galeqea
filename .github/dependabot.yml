# Keep dependencies current across the polyglot repo. Grouped so a week's patch
# and minor updates arrive as one reviewable PR per ecosystem, not a swarm.
version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/api
    schedule: { interval: weekly }
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    labels: ["type/build", "area/backend"]

  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    labels: ["type/build", "area/frontend"]

  - package-ecosystem: npm
    directory: /apps/runner
    schedule: { interval: weekly }
    groups:
      runner-minor-and-patch:
        update-types: [minor, patch]
    labels: ["type/build", "area/runner"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
    labels: ["type/ci"]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    labels: ["type/build"]
