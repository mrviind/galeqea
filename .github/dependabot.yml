# Keep dependencies current across the polyglot repo. Grouped so a week's patch
# and minor updates arrive as one reviewable PR per ecosystem, not a swarm.
# Major bumps are ignored by default — they tend to break the build and deserve a
# deliberate, human-driven upgrade rather than an automatic PR.
version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/api
    schedule: { interval: weekly }
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["type/build", "area/backend"]

  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["type/build", "area/frontend"]

  - package-ecosystem: npm
    directory: /apps/runner
    schedule: { interval: weekly }
    groups:
      runner-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["type/build", "area/runner"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["type/ci"]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["type/build"]
