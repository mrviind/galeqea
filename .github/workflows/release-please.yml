name: Release

on:
  push: { branches: [main] }

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Reads Conventional Commit history and maintains a release PR: when merged,
      # it bumps the version, updates CHANGELOG.md, and tags vX.Y.Z. Nothing is
      # released without a human merging that PR - the same shape as the product's
      # own approval gate.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
