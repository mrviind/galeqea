<!doctype html>
<html>
<head>
<meta charset="utf-8"><title>Acme — Account settings</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 20px;color:#111}
 input{padding:9px;width:100%;border:1px solid #ccc;border-radius:6px;margin-bottom:14px}
 button{padding:10px 18px;border:0;border-radius:6px;background:#2563eb;color:#fff;font-weight:600;cursor:pointer;margin-right:8px}
 .icon{background:#eee;color:#eee;width:38px}
 a{color:#2563eb}
</style>
</head>
<body>
<!--
  A deliberately defective page, used to demonstrate what exploratory testing
  detects. Every problem below is one GaleQEA's deterministic checks find with
  no model involved. Do not "fix" these — they are the fixture.
-->
<h1>Account settings</h1>
<p><a href="/">Back to checkout</a></p>

<!-- no <label>, no aria-label, no placeholder: unaddressable and unannounced -->
<input id="displayName" />

<input id="bio" placeholder="Short bio" />

<!-- icon-only button with no accessible name -->
<button class="icon" onclick="wipe()">&nbsp;</button>

<button onclick="save()">Save changes</button>

<!-- image with no alt text -->
<img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="80" height="24" />

<script>
  // Silently discards what the user typed, without navigating.
  function wipe() {
    document.getElementById('displayName').value = '';
    document.getElementById('bio').value = '';
  }
  function save() {
    // An uncaught error on the primary action.
    undefinedHelper.persist({ name: document.getElementById('displayName').value });
  }
</script>
</body>
</html>
