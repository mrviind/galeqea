openapi: 3.0.3
info: { title: Orders API, version: "1.4.0" }
servers: [{ url: "https://api.example.com/v1" }]
security: [{ bearerAuth: [] }]
paths:
  /orders:
    get:
      operationId: listOrders
      summary: List orders
      tags: [Orders]
      parameters:
        - { name: status, in: query, required: true, schema: { type: string, enum: [open, shipped, cancelled] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: customerEmail, in: query, required: false, schema: { type: string, format: email } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  total: { type: integer, minimum: 0 }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }
        "400": { description: bad request }
    post:
      operationId: createOrder
      summary: Create an order
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewOrder" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "422": { description: validation failed }
  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Fetch one order
      tags: [Orders]
      security: []
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { description: not found }
components:
  schemas:
    Order:
      type: object
      required: [id, status, totalAmount]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [open, shipped, cancelled] }
        totalAmount: { type: number, minimum: 0 }
        customerEmail: { type: string, format: email }
        createdAt: { type: string, format: date-time }
    NewOrder:
      type: object
      required: [customerEmail, totalAmount]
      properties:
        customerEmail: { type: string, format: email }
        totalAmount: { type: number, minimum: 0.01 }
        quantity: { type: integer, minimum: 1, maximum: 999 }
        notes: { type: string, maxLength: 500 }
