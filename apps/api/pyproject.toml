[project]
name = "galeqea"
version = "0.1.0"
description = "GaleQEA - the AI-first, open-source test automation agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "GaleQEA Contributors", email = "aravind3@gmail.com" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "alembic>=1.13",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.17",
  "httpx>=0.27",
  "cryptography>=43.0",
  "passlib[bcrypt,argon2]>=1.7.4",
  "pyjwt>=2.9",
  # Login rate limiting for the shared (multi-user) deployment.
  "slowapi>=0.1.9",
  "apscheduler>=3.10",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "numpy>=1.26",
  "typer>=0.13",
  "rich>=13.9",
  "jinja2>=3.1",
  # Visual regression: real pixel comparison and perceptual hashing. The code
  # degrades to structural-only comparison without it, but that loses the
  # ability to say *where* a screen changed.
  "pillow>=11.0",
  # Requirement registers arrive as spreadsheets more often than as prose.
  "openpyxl>=3.1",
  # OpenAPI documents are YAML more often than JSON. Declared explicitly rather
  # than relied on transitively through uvicorn[standard].
  "pyyaml>=6.0",
  "mcp>=1.2",
  # Structured (JSON) logging for shared deployments.
  "structlog>=24.1",
  # Prometheus /metrics endpoint.
  "prometheus-client>=0.20",
  # OIDC single sign-on (Authlib is BSD-3; itsdangerous signs the OIDC state cookie).
  "authlib>=1.3",
  "itsdangerous>=2.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
# Layout-faithful ingestion of PDF/DOCX/PPTX (headings, tables, page structure).
# docling is MIT; heavy (pulls torch), so it is opt-in. Ingest degrades to
# pypdf/python-docx without it.
docling = ["docling>=2.0"]
# S3-compatible artifact storage (AWS S3, SeaweedFS, R2, Ceph…). boto3 is Apache-2.0.
s3 = ["boto3>=1.34"]
# Durable Postgres-backed job queue for the `full` profile (LISTEN/NOTIFY +
# SKIP LOCKED). procrastinate is MIT. The default SQLite install never needs it,
# it uses the in-process queue.
worker = ["procrastinate>=3.0"]
# OpenTelemetry tracing (OTLP). All Apache-2.0.
otel = [
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13",
       "jsonschema>=4.20", "xmlschema>=3.0", "boto3>=1.34"]

[project.scripts]
galeqea = "galeqea.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["galeqea"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic migration scripts are generated; don't hold them to the app's lint rules.
extend-exclude = ["galeqea/migrations/versions", "galeqea/migrations/env.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
